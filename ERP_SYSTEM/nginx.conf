# =============================================================
#  Nginx — الواجهة الأمامية لنظام إدارة الحسابات
#  - يقدّم ملفات الـ SPA مع fallback للراوتر (react-router)
#  - يعمل proxy لطلبات الـ API إلى حاوية minierp-api
#  - يدعم اتصال SignalR (WebSocket) لخدمة التحديثات اللحظية
#  - يحلّ اسم الخدمة عبر DNS الداخلي لـ Docker وقت الطلب
# =============================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS الداخلي لـ Docker Compose (يحلّ أسماء الخدمات مثل api)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # حجم مرفقات الفواتير (حوّل الإيصالات/التقارير)
    client_max_body_size 25m;

    # ضغط الاستجابات
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # ---------- طلبات الـ API ----------
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- SignalR (WebSocket upgrade) ----------
    location /hubs/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- فحوصات الصحة + Swagger ----------
    location ~ ^/(health|swagger) {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- ملفات الواجهة (SPA) ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}